# /etc/nginx/sites-available/apuracao.tonicoimbra.com
# O certbot acrescenta o bloco HTTPS (listen 443) automaticamente.
server {
    listen 80;
    server_name apuracao.tonicoimbra.com;

    client_max_body_size 20m;   # arquivo exportado pelo celular

    location /static/ {
        alias /srv/apura_bu/servidor/staticfiles/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
